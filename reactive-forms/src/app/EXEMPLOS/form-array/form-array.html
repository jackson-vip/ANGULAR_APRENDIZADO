<div class="container">
    <form [formGroup]="musicasForm">
        <div class="header-actions">
            <button type="button" class="btn btn-add" (click)="adicionarMusica()">+ Adicionar Música</button>
        </div>

        <div formArrayName="musicas">
            <div class="musica-items">
                @for (musica of musicas.controls; track $index) {
                <div class="musica-item">
                    <div class="form-group">
                        <label [for]="'musica-' + $index">Música {{$index + 1}}</label>
                        <input type="text" [id]="'musica-' + $index" [formControlName]="$index"
                            placeholder="Digite o nome da música">
                    </div>
                    
                    <button type="button" class="btn btn-remove" 
                        (click)="removerMusica($index)" 
                        aria-label="Remover música">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-trash2-icon lucide-trash-2"><path d="M10 11v6"/><path d="M14 11v6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                    </button>
                </div>
                }
            </div>
        </div>

        <p class="status-info">Formulário válido: <strong>{{ musicasForm.valid ? 'Sim' : 'Não' }}</strong></p>

        <button type="submit" class="btn btn-submit" 
            [disabled]="musicasForm.invalid"
            (click)="enviarForm()">Salvar
        </button>
    </form>
</div>
